server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block hidden files / vendor / system
    location ~ /\. { deny all; }
    location ~ ^/(system|application/cache|storage|vendor)/ { deny all; }

    # Assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param CI_ENV $CI_ENV;
        include fastcgi_params;
    }

    # Health — bypass auth, allow monitoring
    location = /health { try_files $uri /index.php?$query_string; }
    location = /health/live { try_files $uri /index.php?$query_string; }
    location = /health/ready { try_files $uri /index.php?$query_string; }
}
