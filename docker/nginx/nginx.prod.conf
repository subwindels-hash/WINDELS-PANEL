# Production server block for docker-compose.production.yml.
#
# TLS terminated here. Place:
#   docker/nginx/certs/fullchain.pem
#   docker/nginx/certs/privkey.pem
# (symlinks to your ACME/client output are fine) before starting nginx,
# or front the stack with a load balancer that terminates TLS and switch
# the `listen 443` block back to plain HTTP.
#
# Set SERVER_NAME via your reverse proxy of choice; '_' keeps this file
# importable as-is.

# HTTP → HTTPS redirect, and ACME HTTP-01 challenge passthrough.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /health/live { try_files $uri /index.php?$query_string; }

    location / {
        return 301 https://$host$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MARVYSOCIALS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 20m;

    # Block hidden files / vendor / system
    location ~ /\. { deny all; }
    location ~ ^/(system|application|storage|vendor|docs|tests|tools|cron)/ { deny all; }

    # Assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Health — bypass auth, allow monitoring / load balancer probes.
    location = /health { try_files $uri /index.php?$query_string; }
    location = /health/live { try_files $uri /index.php?$query_string; }
    location = /health/ready { try_files $uri /index.php?$query_string; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
