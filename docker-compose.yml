version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: windels-panel:php
    container_name: windels_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - windels

  nginx:
    image: nginx:1.25-alpine
    container_name: windels_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - windels

  mysql:
    image: mysql:8.0
    container_name: windels_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: windels_panel
      MYSQL_USER: windels
      MYSQL_PASSWORD: windels_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "windels", "-pwindels_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - windels

  redis:
    image: redis:7-alpine
    container_name: windels_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - windels

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: windels_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - windels

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: windels_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - windels

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  windels:
    driver: bridge
