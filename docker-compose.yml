# WINDELS PANEL — DEVELOPMENT stack.
#
# One command from a fresh clone:
#   cp .env.example .env && docker compose up -d --build
#
# This file is for local work: weak in-file credentials (only usable inside
# the private compose network), MailHog instead of real SMTP, MinIO instead
# of real object storage, hot-mounted source code. Credentials here are
# OVERRIDDEN by .env — never point this file at the internet.
#
# Production deployments MUST use docker-compose.production.yml instead
# (required ${VAR:?} secrets, no MailHog/MinIO, TLS on nginx, log rotation).

name: windels-panel

services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: windels-panel:php
    container_name: windels_app
    restart: unless-stopped
    working_dir: /var/www/html
    # Create runtime dirs, then refuse to serve if the deployment is unsafe
    # (placeholder ENCRYPTION_KEY, unapplied migrations, unwritable storage).
    command: >
      sh -c "php index.php deploy storage &&
             php index.php deploy check &&
             php-fpm"
    volumes:
      - ./:/var/www/html
      - ./storage/logs:/var/www/html/storage/logs
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - windels
    healthcheck:
      # PHP-FPM pool accepting FastCGI connections. Deeper checks app-side:
      # GET /health/live and /health/ready are served through nginx below.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Workers. The app container serves web requests only; without this nothing
  # runs the 15 cron jobs (drip-feed, order status, payouts, email queue...).
  cron:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    image: windels-panel:php
    container_name: windels_cron
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "php index.php deploy storage &&
       crontab /var/www/html/cron/crontab.example &&
       touch /var/www/html/storage/logs/cron.log &&
       (crond -f -l 8 2>/dev/null || cron -f)"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - windels

  nginx:
    image: nginx:1.25-alpine
    container_name: windels_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - windels
    healthcheck:
      # BusyBox wget ships with the alpine image; /health/live bypasses auth.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:8.0
    container_name: windels_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # Development defaults; .env overrides. Not for production (see the
      # production compose file and .env.production.example).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-windels_panel}
      MYSQL_USER: ${DB_USER:-windels}
      MYSQL_PASSWORD: ${DB_PASSWORD:-windels_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Ping with the dedicated app account, not root — a broken grant is a
      # broken app, and "root works" would hide it.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - windels

  redis:
    image: redis:7-alpine
    container_name: windels_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - windels

  # Dev-only SMTP sink. Production has no MailHog — real SMTP_* credentials.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: windels_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - windels

  # Dev-only S3-compatible storage. Production: a managed bucket (S3/R2).
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: windels_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - windels

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  windels:
    driver: bridge
